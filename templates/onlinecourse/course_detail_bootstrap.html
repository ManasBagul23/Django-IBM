{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2 class="mb-3">{{ course.name }}</h2>

<div class="row">
{% for lesson in course.lesson_set.all %}
<div class="col-md-4">
<div class="card mb-3">
<div class="card-body">
<h5 class="card-title">{{ lesson.title }}</h5>
</div>
</div>
</div>
{% endfor %}
</div>

</div>

{% endblock %}
